<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Capsule prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#FAF9F7;--surface:#FFFFFF;--raised:#FCFBFA;--subtle:#F1EEEB;--hover:#FBFAF9;--navhover:#EFEBE7;
  --border:#E6E1DE;--border-strong:#D2CBC6;--divider:#F1EEEB;--primary:#DCD6D2;--primary-h:#CFC8C3;--control:#8B837E;
  --text:#2A2523;--muted:#5F5854;--faint:#78706B;--dash:#C9C1BB;--disabled-bg:#F1EEEB;--disabled-fg:#8B837E;
  --avatar:#EBE7E4;--avatar-me:#E3DDD8;--agent-bg:#2A2523;--agent-fg:#FAF9F7;--wash:#FFF6EC;--wash-dot:#E9A97C;
  --p-done:#3E9B5F;--p-prog:#4F7BD9;--p-rev:#D9A23A;--p-empty:#E6E1DE;--ok:#166534;--warn-bg:#FEF3C7;--warn-fg:#92400E;
  --scrim:rgba(42,37,35,.24);--focus:#2A2523;
  --sh-card:0 1px 2px rgba(42,37,35,.04),0 4px 16px rgba(42,37,35,.05);
  --sh-pop:0 1px 2px rgba(42,37,35,.06),0 8px 24px rgba(42,37,35,.10);
  --sh-composer:0 1px 2px rgba(42,37,35,.05),0 8px 28px rgba(42,37,35,.08);
  --sh-nav:0 1px 2px rgba(42,37,35,.06);
  --blue-bg:#DBEAFE;--blue-fg:#1E40AF;--teal-bg:#CCFBF1;--teal-fg:#115E59;--green-bg:#DCFCE7;--green-fg:#166534;
  --olive-bg:#ECF0D4;--olive-fg:#4D5B1F;--amber-bg:#FEF3C7;--amber-fg:#92400E;--orange-bg:#FFEDD5;--orange-fg:#9A3412;
  --red-bg:#FEE2E2;--red-fg:#991B1B;--pink-bg:#FCE7F3;--pink-fg:#9D174D;--purple-bg:#EDE9FE;--purple-fg:#5B21B6;
  --gray-bg:#EEEAE6;--gray-fg:#4A443F;
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
[data-theme=dark]{
  --bg:#171513;--surface:#1F1C1A;--raised:#221F1D;--subtle:#2A2623;--hover:#24211F;--navhover:#2A2623;
  --border:#3A3532;--border-strong:#4A4340;--divider:#2A2623;--primary:#3F3936;--primary-h:#4A4340;--control:#8B837E;
  --text:#F1ECE8;--muted:#B3ABA4;--faint:#8F8781;--dash:#5A534F;--disabled-bg:#2A2623;--disabled-fg:#8F8781;
  --avatar:#3A3532;--avatar-me:#4A4340;--agent-bg:#F1ECE8;--agent-fg:#171513;--wash:#2A2118;--wash-dot:#C9875A;
  --p-done:#4FB574;--p-prog:#6E95E8;--p-rev:#E0B050;--p-empty:#3A3532;--ok:#86EFAC;--warn-bg:#3A2A10;--warn-fg:#FCD34D;
  --scrim:rgba(0,0,0,.5);--focus:#F1ECE8;
  --sh-card:none;--sh-pop:0 8px 24px rgba(0,0,0,.35);--sh-composer:none;--sh-nav:none;
  --blue-bg:#1E2A4A;--blue-fg:#93C5FD;--teal-bg:#12312E;--teal-fg:#5EEAD4;--green-bg:#13301F;--green-fg:#86EFAC;
  --olive-bg:#2A2F18;--olive-fg:#C5D38A;--amber-bg:#3A2A10;--amber-fg:#FCD34D;--orange-bg:#3B2112;--orange-fg:#FDBA74;
  --red-bg:#3B1616;--red-fg:#FCA5A5;--pink-bg:#3A1628;--pink-fg:#F9A8D4;--purple-bg:#261C42;--purple-fg:#C4B5FD;
  --gray-bg:#2A2725;--gray-fg:#D6D0CA;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg)}
body{color:var(--text);font-family:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;font-size:14px;line-height:20px;-webkit-font-smoothing:antialiased}
a{color:var(--text)}a:hover{color:var(--text)}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,textarea:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
textarea::placeholder,input::placeholder{color:var(--faint)}
.mono{font-family:'Geist Mono',ui-monospace,monospace;font-size:12px}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.none{flex:none}

/* layout */
.shell{min-height:100vh;display:flex;flex-wrap:wrap;align-items:stretch;background:var(--bg)}
.side{flex:1 1 248px;max-width:100%;padding:20px 12px 16px;background:var(--bg);border-right:1px solid var(--border);display:flex;flex-direction:column;gap:20px;position:sticky;top:0;z-index:50;align-self:flex-start;min-height:100vh}
.mainwrap{flex:999 1 640px;min-width:0}
.main{max-width:1120px;margin:0 auto;padding:40px 32px 72px;display:flex;flex-direction:column;gap:32px}
.main.cap{max-width:1160px;padding:24px 32px 120px;gap:24px}
@media (max-width:900px){.side{position:relative;min-height:0;border-right:none;border-bottom:1px solid var(--border)}.main,.main.cap{padding:24px 16px 72px}}
.brand{display:flex;align-items:center;gap:10px;padding:2px 10px;color:var(--text);text-decoration:none;background:none;border:none;text-align:left}
.brand-mark{width:24px;height:24px;border-radius:7px;background:var(--primary);display:flex;align-items:center;justify-content:center}
.brand-name{font-size:18px;line-height:24px;font-weight:600;letter-spacing:-.02em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-link{width:100%;display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:none;border-radius:8px;background:transparent;color:var(--muted);text-align:left;font-size:14px;font-weight:500;text-decoration:none}
.nav-link:hover{background:var(--navhover);color:var(--text)}
.nav-link.on{background:var(--surface);box-shadow:var(--sh-nav);color:var(--text);font-weight:600}
[data-theme=dark] .nav-link.on{background:var(--raised);box-shadow:inset 0 0 0 1px var(--border)}
.nav-link.space{height:34px;color:var(--text);font-weight:400}
.nav-link.small{height:34px;font-size:13px}
.count{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--primary);color:var(--text);font-size:11px;line-height:20px;font-weight:600;text-align:center}
.count.soft{background:var(--subtle)}
.space-letter{flex:none;width:20px;height:20px;border-radius:6px;background:var(--avatar);font-size:11px;line-height:20px;font-weight:600;text-align:center;color:var(--text)}
.side-h{margin:0 0 4px;padding:0 10px;font-size:12px;line-height:16px;font-weight:500;color:var(--muted)}
.search-btn{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted);font-size:14px}
.search-btn:hover{border-color:var(--border-strong)}
.search-btn.on{border-color:var(--control);background:var(--surface);cursor:text}
.search-btn input{flex:1;min-width:0;width:0;height:100%;border:none;outline:none!important;background:transparent;color:var(--text);font-size:14px;padding:0}
.side.pal-open{z-index:62}
.profile-wrap{position:relative;margin-top:auto;padding-top:12px;border-top:1px solid var(--divider)}

/* buttons */
.btn{height:32px;padding:0 14px;border-radius:999px;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;border:1px solid transparent;background:transparent;color:var(--text);transition:background .12s ease,border-color .12s ease}
.btn.md{height:36px;padding:0 16px;font-size:14px}
.btn.lg{height:40px;padding:0 18px;font-size:14px}
.btn-primary{background:var(--primary);border-color:var(--primary)}
.btn-primary:hover{background:var(--primary-h);border-color:var(--primary-h)}
.btn-secondary{background:var(--surface);border-color:var(--border)}
.btn-secondary:hover{background:var(--bg);border-color:var(--border-strong)}
.btn-quiet{color:var(--muted)}
.btn-quiet:hover{background:var(--subtle);color:var(--text)}
.btn-link{height:auto;padding:0;border:none;background:none;font-weight:600;text-decoration:underline;text-underline-offset:3px;color:var(--text)}
.btn[disabled],.btn.disabled{background:var(--disabled-bg);border-color:var(--disabled-bg);color:var(--disabled-fg);cursor:default}
.icon-btn{width:32px;height:32px;padding:0;border-radius:999px;border:none;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;flex:none}
.icon-btn:hover{background:var(--subtle);color:var(--text)}
.icon-btn.sq{border-radius:8px}
.send{width:36px;height:36px;border-radius:999px;border:none;background:var(--primary);color:var(--text);display:flex;align-items:center;justify-content:center;flex:none}
.send:hover{background:var(--primary-h)}
.send[disabled]{background:var(--disabled-bg);color:var(--disabled-fg);cursor:default}
.send.sm{width:28px;height:28px}
.chip{height:30px;padding:0 12px;border-radius:999px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip:hover{background:var(--subtle)}
.chip.on{background:var(--primary);border-color:var(--primary)}
.chip.surface{background:var(--surface)}
.chip.surface.on{background:var(--primary)}
.seg{display:inline-flex;gap:2px;padding:3px;border-radius:999px;background:var(--subtle)}
.seg button{height:26px;padding:0 12px;border:none;border-radius:999px;background:transparent;color:var(--muted);font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(42,37,35,.10)}
[data-theme=dark] .seg button.on{background:var(--primary);box-shadow:none}
.seg.icons button{width:26px;height:24px;padding:0}

/* cards & text */
.card{border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-card)}
.h1{margin:0;font-size:28px;line-height:34px;font-weight:600;letter-spacing:-.02em}
.h2{margin:0;font-size:16px;line-height:24px;font-weight:600}
.h2 .n{font-weight:400;color:var(--muted)}
.sec{display:flex;flex-direction:column;gap:12px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.link{font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:3px;color:var(--text);background:none;border:none;padding:0}
.small{font-size:13px;line-height:18px}
.tiny{font-size:12px;line-height:16px}
.divider{height:1px;margin:4px 6px;background:var(--divider)}

/* tags, pills, avatars */
.tag{flex:none;display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:12px;line-height:20px;font-weight:500;white-space:nowrap}
.tag.lg{height:22px;padding:0 8px;border-radius:8px}
.pill{display:inline-flex;align-items:center;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.c-blue{background:var(--blue-bg);color:var(--blue-fg)}.c-teal{background:var(--teal-bg);color:var(--teal-fg)}
.c-green{background:var(--green-bg);color:var(--green-fg)}.c-olive{background:var(--olive-bg);color:var(--olive-fg)}
.c-amber{background:var(--amber-bg);color:var(--amber-fg)}.c-orange{background:var(--orange-bg);color:var(--orange-fg)}
.c-red{background:var(--red-bg);color:var(--red-fg)}.c-pink{background:var(--pink-bg);color:var(--pink-fg)}
.c-purple{background:var(--purple-bg);color:var(--purple-fg)}.c-gray{background:var(--gray-bg);color:var(--gray-fg)}
.d-blue{--d:color-mix(in srgb,var(--blue-bg),var(--blue-fg) 28%)}.d-teal{--d:color-mix(in srgb,var(--teal-bg),var(--teal-fg) 28%)}
.d-green{--d:color-mix(in srgb,var(--green-bg),var(--green-fg) 28%)}.d-olive{--d:color-mix(in srgb,var(--olive-bg),var(--olive-fg) 28%)}
.d-amber{--d:color-mix(in srgb,var(--amber-bg),var(--amber-fg) 28%)}.d-orange{--d:color-mix(in srgb,var(--orange-bg),var(--orange-fg) 28%)}
.d-red{--d:color-mix(in srgb,var(--red-bg),var(--red-fg) 28%)}.d-pink{--d:color-mix(in srgb,var(--pink-bg),var(--pink-fg) 28%)}
.d-purple{--d:color-mix(in srgb,var(--purple-bg),var(--purple-fg) 28%)}.d-gray{--d:color-mix(in srgb,var(--gray-bg),var(--gray-fg) 28%)}
.f-blue{--f:var(--blue-fg)}.f-teal{--f:var(--teal-fg)}.f-green{--f:var(--green-fg)}.f-olive{--f:var(--olive-fg)}.f-amber{--f:var(--amber-fg)}
.f-orange{--f:var(--orange-fg)}.f-red{--f:var(--red-fg)}.f-pink{--f:var(--pink-fg)}.f-purple{--f:var(--purple-fg)}.f-gray{--f:var(--gray-fg)}
.dot{flex:none;width:10px;height:10px;border-radius:999px;background:var(--d)}
.dot.sm{width:8px;height:8px}
.av{flex:none;width:28px;height:28px;border-radius:999px;background:var(--avatar);color:var(--text);font-size:12px;line-height:28px;font-weight:600;text-align:center;display:inline-flex;align-items:center;justify-content:center}
.av.s24{width:24px;height:24px;font-size:11px;line-height:24px}
.av.s22{width:22px;height:22px;font-size:10px;line-height:22px}
.av.s26{width:26px;height:26px;font-size:11px}
.av.s32{width:32px;height:32px;font-size:13px}
.av.me{background:var(--avatar-me)}
.ag{flex:none;border-radius:999px!important;background:#fff;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;overflow:hidden;box-shadow:inset 0 0 0 1px #E6E1DE}
.ag img{display:block;width:72%;height:72%;object-fit:contain}
.stack{display:inline-flex;align-items:center;padding-left:6px}
.stack>*{margin-left:-6px;box-shadow:0 0 0 2px var(--surface);position:relative}
.layer{flex:none;position:relative;width:46px;height:28px}
.layer .av{position:absolute;left:0;top:0;box-shadow:0 0 0 2px var(--surface)}
.layer .ag{position:absolute;left:22px;top:3px;width:22px;height:22px}
.layer.sm{width:41px;height:24px}
.layer.sm .ag{left:20px;top:3px;width:19px;height:19px}
.src{flex:none;display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 7px 0 4px;border-radius:7px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:12px;font-weight:500;text-decoration:none;white-space:nowrap}
.src:hover{border-color:var(--border-strong)}
.dashed-av{flex:none;width:24px;height:24px;border-radius:999px;border:1.5px dashed var(--dash)}

/* popovers */
.pop{position:absolute;z-index:40;padding:6px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--sh-pop)}
[data-theme=dark] .pop{background:var(--raised)}
.menu-item{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px;border:none;border-radius:8px;background:transparent;color:var(--text);text-align:left;font-size:14px;text-decoration:none}
.menu-item:hover{background:var(--subtle)}
.menu-item.muted{color:var(--muted)}
.menu-label{margin:0;padding:8px 10px 6px;font-size:12px;line-height:16px;font-weight:500;color:var(--muted)}
.pop-in{animation:popIn .14s var(--ease) both}
@keyframes popIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}

/* composer */
.composer{display:flex;flex-direction:column;gap:12px;padding:16px 16px 12px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-composer);transition:box-shadow .2s ease,border-color .2s ease}
.composer:focus-within{border-color:var(--dash);box-shadow:0 0 0 4px var(--navhover),var(--sh-composer)}
.composer textarea{flex:1;min-width:0;border:none;outline:none!important;resize:none;padding:0;background:transparent;color:var(--text);font:inherit;font-size:16px;line-height:24px}
.composer-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding-top:12px;border-top:1px solid var(--divider)}

/* attention rows */
.attn{list-style:none;margin:0;padding:0}
.attn>li{position:relative;border-bottom:1px solid var(--divider)}
.attn>li:last-child{border-bottom:none}
.attn-row{display:flex;align-items:center;gap:8px;padding-right:10px}
.attn-row:hover{background:var(--hover)}
.attn>li:first-child .attn-row,.attn>li:first-child .confirm{border-radius:15px 15px 0 0}
.attn-main{flex:1;min-width:0;display:flex;align-items:center;gap:12px;min-height:68px;padding:12px 4px 12px 20px;border:none;background:transparent;color:var(--text);text-align:left}
.attn-title{font-size:14px;line-height:20px;font-weight:500}
.attn-ctx{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;color:var(--muted);white-space:nowrap;overflow:hidden}
.attn-acts{flex:none;display:flex;align-items:center;gap:6px}
.when{flex:none;min-width:28px;text-align:right;font-size:12px;line-height:16px;color:var(--muted)}
.row-x{width:0!important;margin-left:-8px;opacity:0;overflow:hidden;transition:width .15s ease,margin .15s ease,opacity .12s}
li:hover>.attn-row .row-x,li:focus-within>.attn-row .row-x,.row-x[aria-expanded=true]{width:32px!important;margin-left:0;opacity:1}
@media (hover:none){.row-x{width:32px!important;margin-left:0;opacity:1}}
.tray{display:flex;flex-direction:column;gap:12px;margin:0 12px 12px;padding:16px;border-radius:12px;background:var(--bg);box-shadow:inset 0 1px 2px rgba(42,37,35,.06)}
.tray.tight{gap:10px}
.quote{margin:0;display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--surface);border:1px solid var(--border)}
.field-inline{flex:1;min-width:0;display:flex;align-items:center;gap:6px;height:40px;padding:0 6px 0 12px;border-radius:12px;border:1px solid var(--control);background:var(--surface)}
.field-inline input{flex:1;min-width:0;height:100%;padding:0;border:none;outline:none!important;background:transparent;font-size:14px}
.agent-strip{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:var(--surface);border:1px solid var(--border);font-size:13px;line-height:18px}
.confirm{display:flex;align-items:center;gap:10px;min-height:52px;max-height:60px;padding:0 12px 0 20px;background:var(--raised);font-size:14px;line-height:20px;overflow:hidden;animation:fold .3s ease 4.7s forwards}
@keyframes fold{to{min-height:0;max-height:0;opacity:0}}
.ok-ic{color:var(--ok);flex:none}
.foot-note{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 20px;font-size:13px;line-height:18px;color:var(--muted);border-top:1px solid var(--divider)}
.welcome-row{position:relative;border-bottom:1px solid var(--divider);border-radius:15px 15px 0 0;background:var(--surface);animation:wash 1.6s ease 4.5s both}
.welcome-row.fresh{background:var(--wash)}
@keyframes wash{to{background:var(--surface)}}
.welcome-dot{flex:none;width:10px;height:10px;border-radius:999px;background:var(--wash-dot);animation:pulseDot 1.6s ease-in-out 3}
@keyframes pulseDot{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:36px 32px;text-align:center}
.empty-ic{width:44px;height:44px;border-radius:999px;background:var(--subtle);display:flex;align-items:center;justify-content:center}
.empty-t{margin:0;font-size:17px;line-height:24px;font-weight:600}
.empty-s{margin:0;max-width:440px;font-size:14px;line-height:20px;color:var(--muted)}

/* activity */
.feed{list-style:none;margin:0;padding:4px 20px}
.feed>li{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--divider)}
.feed.sm{padding:4px 16px}
.feed.sm>li{gap:10px;padding:12px 0}
.feed>li.hl{animation:hl 2.4s ease both}
@keyframes hl{0%,40%{background:var(--wash);box-shadow:0 0 0 8px var(--wash)}100%{background:transparent;box-shadow:0 0 0 8px transparent}}
.feed-end{padding:12px 0;font-size:13px;color:var(--muted);border-bottom:none!important}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;font-size:13px;line-height:18px;color:var(--muted)}
.meta a{color:var(--muted)}

/* capsule cards on home */
.cap-row{display:flex;flex-direction:column;gap:10px;margin:0 -8px;padding:14px 8px;border-top:1px solid var(--divider);border-radius:10px;color:var(--text);text-decoration:none;background:none;border-left:none;border-right:none;border-bottom:none;text-align:left;width:calc(100% + 16px)}
.cap-row:hover{background:var(--hover)}
.segs{display:flex;gap:3px}
.segs span{flex:1;height:4px;border-radius:999px;background:var(--p-empty)}
.segs.lg{gap:4px}.segs.lg span{height:6px}
.s-done{background:var(--p-done)!important}.s-progress{background:var(--p-prog)!important}.s-review{background:var(--p-rev)!important}
.risk{display:flex;align-items:center;gap:6px;font-size:12px;line-height:16px;color:var(--warn-fg)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:14px;line-height:20px}
.tbl th{padding:12px 12px 10px;text-align:left;font-size:12px;line-height:16px;font-weight:500;color:var(--muted);border-bottom:1px solid var(--divider)}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--divider);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tbody tr:hover{background:var(--hover);cursor:pointer}
.tbl th:first-child,.tbl td:first-child{padding-left:20px}
.tbl th:last-child,.tbl td:last-child{padding-right:20px}
.select-wrap{position:relative;display:flex;align-items:center}
.select{appearance:none;-webkit-appearance:none;height:36px;padding:0 32px 0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:13px;font-weight:500;cursor:pointer}
.select-wrap svg{position:absolute;right:12px;pointer-events:none;color:var(--muted)}
.field{display:flex;align-items:center;gap:8px;height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.field:focus-within{border-color:var(--control)}
.field input{flex:1;min-width:0;height:100%;padding:0;border:none;outline:none!important;background:transparent;color:var(--text);font-size:14px}
.input{height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;width:100%}
.input:focus{border-color:var(--control);outline:none}
textarea.input{height:auto;padding:10px 12px;resize:vertical;line-height:20px}
.input.sm{height:32px;padding:0 8px;border-radius:8px;font-size:13px;width:auto}
.input.edit{border-color:var(--control)}
.lbl{font-size:13px;line-height:18px;font-weight:500}

/* tabs */
.tabs{display:flex;flex-wrap:wrap;align-items:flex-end;gap:4px}
.tab{position:relative;flex:none;height:40px;padding:0 18px;border:none;border-bottom:2px solid transparent;border-radius:8px 8px 0 0;background:transparent;color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{color:var(--text);font-weight:600;border-bottom-color:var(--f,var(--text))}
.tab.mine{background:var(--subtle)}
.tab .tdot{position:absolute;left:6px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:999px;background:var(--d);opacity:0;transition:opacity .15s ease}
.tab:hover .tdot,.tab.on .tdot,.tab:focus-visible .tdot{opacity:1}
.tab-bar{position:relative;display:flex;align-items:flex-end;gap:4px;padding:8px 10px 0;border-bottom:1px solid var(--divider)}
.tabs.editing .tab{padding-right:34px}
.tab-x{position:absolute;top:50%;right:8px;transform:translateY(-50%);z-index:2;width:20px;height:20px;padding:0;border-radius:999px;border:none;background:transparent;color:var(--muted);display:flex;align-items:center;justify-content:center}
.tab-x:hover{color:var(--text);background:var(--navhover)}

/* capsule page */
.editable{border:none;background:transparent;padding:2px 6px;margin:-2px -6px;border-radius:8px;color:inherit;text-align:left;cursor:text;font:inherit;letter-spacing:inherit}
.editable:hover{background:var(--subtle)}
.ed-ok,.ed-x{flex:none;width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.ed-ok{border:none;background:var(--primary);color:var(--text)}
.ed-ok:hover{background:var(--primary-h)}
.ed-x{border:1px solid var(--border);background:var(--surface);color:var(--muted)}
.ed-x:hover{color:var(--text)}
.dl{margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:10px 28px;font-size:13px}
.dl>div{display:flex;align-items:center;gap:8px;min-height:28px}
.dl dt{color:var(--muted)}
.dl dd{margin:0;display:flex;align-items:center;gap:6px;font-weight:500}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .k{font-size:12px;line-height:16px;color:var(--muted)}
.stat .v{font-size:22px;line-height:28px;font-weight:600;letter-spacing:-.01em}
.wi{display:flex;align-items:center;gap:12px;min-height:48px;margin:0 -8px;padding:6px 8px;border-bottom:1px solid var(--divider);border-radius:8px}
.wi:hover{background:var(--hover)}
.wi.hl{animation:hl 2.4s ease both}
.wi input[type=checkbox]{flex:none;width:18px;height:18px;margin:0;accent-color:#A39A94}
.lockbox{flex:none;width:18px;height:18px;border-radius:5px;border:1.5px solid var(--dash);background:var(--subtle);display:flex;align-items:center;justify-content:center;color:var(--muted)}
.assignee{flex:none;display:inline-flex;align-items:center;gap:6px;min-width:112px;font-size:13px;color:var(--muted)}
.add-line{display:flex;align-items:center;gap:6px;height:40px;margin-top:12px;padding:0 6px 0 10px;border-radius:12px;border:1px dashed var(--border);color:var(--muted)}
.add-line:focus-within{border-style:solid;border-color:var(--control)}
.add-line input{flex:1;min-width:0;height:100%;padding:0;border:none;outline:none!important;background:transparent;color:var(--text);font-size:14px}
.team-row{width:100%;min-width:0;display:grid;grid-template-columns:1fr auto auto 14px;align-items:center;gap:10px;min-height:44px;padding:6px 10px;border:none;border-radius:10px;background:transparent;text-align:left;color:var(--text)}
.team-row:hover{background:var(--hover)}
.banner{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-card)}
.warnbox{display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--warn-bg);color:var(--text)}
.warnbox .wt{color:var(--warn-fg);font-weight:600}
.proto-pill{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border:1px dashed var(--dash);border-radius:999px;font-size:12px;color:var(--muted)}

/* drawer & modals */
.scrim{position:fixed;inset:0;z-index:60;background:var(--scrim);animation:fadeIn .2s ease both}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:61;width:600px;max-width:100vw;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 32px rgba(42,37,35,.12);display:flex;flex-direction:column;animation:drawerIn .35s var(--ease) both}
@keyframes drawerIn{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.draft{display:flex;flex-direction:column;gap:12px;padding:18px 20px;border-radius:12px;background:var(--bg);border:1px solid var(--border);font-size:14px;line-height:22px}
.draft[contenteditable=true]{outline:2px solid var(--control);outline-offset:2px;background:var(--surface)}
.draft pre{margin:0;font-family:'Geist Mono',ui-monospace,monospace;font-size:12px;line-height:18px;white-space:pre-wrap}
.palette{position:fixed;left:50%;top:12vh;z-index:61;width:560px;max-width:calc(100vw - 32px);transform:translateX(-50%);background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--sh-pop);overflow:hidden;animation:popIn .16s var(--ease) both}
[data-theme=dark] .palette{background:var(--raised)}
.palette input{width:100%;height:52px;padding:0 18px;border:none;border-bottom:1px solid var(--divider);background:transparent;font-size:16px;outline:none!important;color:var(--text)}
.pal-item{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;padding:8px 16px;border:none;background:transparent;text-align:left;color:var(--text)}
.pal-item:hover,.pal-item.on{background:var(--subtle)}
.toasts{position:fixed;left:50%;bottom:24px;z-index:80;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{pointer-events:auto;display:flex;align-items:center;gap:10px;min-height:44px;padding:0 8px 0 16px;border-radius:999px;background:var(--text);color:var(--bg);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.18);animation:toastIn .3s var(--ease) both}
.toast .btn-link{color:var(--bg);font-size:13px;padding:0 10px}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}

/* new capsule */
.chipq{height:32px;padding:0 14px;border-radius:999px;border:1px solid var(--border);background:var(--bg);font-size:13px}
.comp-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;min-height:60px;padding:10px 8px 10px 14px;border-radius:12px}
.comp-row:hover{background:var(--hover)}
.think-bar{display:block;width:100%;height:2px;border-radius:999px;background:var(--navhover);overflow:hidden}
.think-bar span{display:block;height:100%;border-radius:999px;background:var(--control);transition:width .5s var(--ease)}
.create-bar{position:sticky;bottom:16px;z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:14px 14px 14px 20px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:0 1px 2px rgba(42,37,35,.06),0 12px 32px rgba(42,37,35,.12)}
[data-theme=dark] .create-bar{background:var(--raised)}
.sense{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:6px 14px}
.sense li{display:flex;align-items:center;gap:6px;font-size:13px;line-height:18px;transition:color .3s ease}
.sense .dot{transition:transform .3s var(--ease),background .3s ease}
.alert{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-pop)}

/* motion */
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rise{animation:rise .3s ease both}
@keyframes rowIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.row-in{animation:rowIn .7s var(--ease) both}
@keyframes dotPop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.dot-pop{animation:dotPop .7s var(--ease) both}
.fade-in{animation:fadeIn .6s ease both}
@keyframes liftIn{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.lift-in{animation:liftIn .85s var(--ease) both}
@keyframes statusIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.status-in{animation:statusIn .55s var(--ease) both}
@keyframes titleIn{from{opacity:0;transform:translate(16px,10px)}to{opacity:1;transform:none}}
.title-in{animation:titleIn .75s var(--ease) both}
@keyframes unfold{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.unfold{animation:unfold 1s var(--ease) .55s both}
.ctrl-in{animation:fadeIn .5s ease .65s both}
@keyframes barIn{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.bar-in{animation:barIn .7s var(--ease) 1.1s both}
.col-in{animation:rowIn .7s var(--ease) .35s both}
@keyframes sideIn{from{opacity:0;transform:translateX(24px)}to{opacity:1;transform:none}}
.side-in{animation:sideIn .7s var(--ease) .55s both}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:40px 20px}
.persona{display:flex;flex-direction:column;gap:10px;padding:20px;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:var(--sh-card);text-align:left;color:var(--text);transition:border-color .15s ease,transform .15s var(--ease)}
.persona:hover{border-color:var(--border-strong);transform:translateY(-2px)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}

/* settings / onboarding */
.set-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px;border-top:1px solid var(--divider)}
.set-row:first-child{border-top:none}
.switch{position:relative;flex:none;width:38px;height:22px;border-radius:999px;border:none;background:var(--border-strong);padding:0;transition:background .15s ease}
.switch::after{content:'';position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:999px;background:var(--surface);transition:transform .15s var(--ease);box-shadow:0 1px 2px rgba(0,0,0,.2)}
.switch.on{background:var(--text)}
.switch.on::after{transform:translateX(16px)}
.switch[disabled]{opacity:.5;cursor:default}
.swatch{width:22px;height:22px;border-radius:999px;border:2px solid transparent;padding:0}
.swatch.on{border-color:var(--text)}
.rail-step{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border:none;border-radius:8px;background:transparent;color:var(--muted);font-size:14px;font-weight:500;text-align:left;width:100%}
.rail-step.on{background:var(--subtle);color:var(--text);font-weight:600}
.rail-step.done{color:var(--text)}
.rail-mark{flex:none;width:22px;height:22px;border-radius:999px;border:1.5px solid var(--dash);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.rail-step.on .rail-mark{border-color:var(--text)}
.rail-step.done .rail-mark{background:var(--text);border-color:var(--text);color:var(--bg)}
.exit-out{animation:exitOut .42s cubic-bezier(.4,0,.2,1) forwards}
@keyframes exitOut{to{opacity:0;transform:translateY(-10px) scale(.985)}}

.attn>li:last-child>.attn-row:last-child,.attn>li:last-child>.confirm{border-radius:0 0 15px 15px}
.attn>li:first-child:last-child>.attn-row:last-child,.attn>li:first-child:last-child>.confirm{border-radius:15px}
.attn.under>li:first-child .attn-row,.attn.under>li:first-child .confirm{border-radius:0}
.attn.under>li:last-child>.attn-row:last-child,.attn.under>li:last-child>.confirm{border-radius:0 0 15px 15px}
.attn.mid>li:last-child>.attn-row,.attn.mid>li:last-child>.confirm{border-radius:0}
.toast{max-width:calc(100vw - 32px)}

.thread{list-style:none;margin:8px 0 0;padding:2px 0 0 12px;border-left:2px solid var(--border);display:flex;flex-direction:column;gap:10px}
.thread>li{display:flex;align-items:flex-start;gap:8px;border-radius:8px}
.thread>li.hl{animation:hl 2.4s ease both}
.thread-in{animation:rise .2s ease both}

.color-pick{position:relative;flex:none;display:inline-flex;align-items:center;gap:2px;height:30px;padding:0 4px 0 5px;border-radius:999px;border:1px solid transparent;background:transparent;color:var(--muted);transition:border-color .12s ease,background .12s ease}
.color-pick .sw{width:20px;height:20px;border-radius:999px}
.color-pick .cv{display:flex;opacity:.45;transition:opacity .12s ease}
.color-pick:hover,.color-pick.open,.color-pick:focus-visible{border-color:var(--border-strong);background:var(--surface)}
.color-pick:hover .cv,.color-pick.open .cv{opacity:1}
.desc-edit{border-color:transparent!important;background:transparent!important;color:var(--muted)}
.desc-edit:hover{background:var(--subtle)!important}
.desc-edit:focus{border-color:var(--control)!important;background:var(--surface)!important;color:var(--text)}
.input.bad,.input.bad:focus{border-color:var(--red-fg)}
.invite-pill{padding-right:6px}
.pill-x{width:18px;height:18px;padding:0;margin-left:2px;border:none;border-radius:999px;background:transparent;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;opacity:0;transition:opacity .12s ease}
.invite-pill:hover .pill-x,.pill-x:focus-visible{opacity:1}
.pill-x:hover{background:var(--subtle);color:var(--text)}
@media (hover:none){.pill-x{opacity:1}}
.seg{flex:none}
.seg button{white-space:nowrap}
.set-row.wrap{flex-wrap:wrap}
.brand-mark{display:none!important}

/* orbit motion (new capsule) */
.orbit-layer{position:fixed;inset:0;z-index:45;pointer-events:none;overflow:hidden}
.orbit-layer>*{position:absolute;left:0;top:0;will-change:transform,opacity}
.ob-amb{width:300px;height:300px;border-radius:999px;filter:blur(60px);opacity:.55}
[data-theme=dark] .ob-amb{opacity:.3}
.ob-glass,.ob-face{background:color-mix(in srgb,var(--surface) 55%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);border:1px solid color-mix(in srgb,#fff 70%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 12px 32px rgba(42,37,35,.10)}
[data-theme=dark] .ob-glass,[data-theme=dark] .ob-face{border-color:rgba(255,255,255,.14);box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 12px 32px rgba(0,0,0,.4)}
.ob-composer{border-radius:20px;padding:18px 20px;font-size:16px;line-height:24px;overflow:hidden;transform-origin:center}
/* the "page" being shaped: a mini frosted doc with shimmering placeholder lines, no text */
.ob-orb{width:176px;height:108px;border-radius:18px;padding:16px 16px 0;display:flex;flex-direction:column;gap:9px;transform-origin:center}
.ob-l{display:block;height:7px;border-radius:999px;background:linear-gradient(90deg,color-mix(in srgb,var(--text) 9%,transparent) 0%,color-mix(in srgb,var(--text) 3%,transparent) 45%,color-mix(in srgb,var(--text) 9%,transparent) 90%);background-size:220% 100%;animation:obShimmer 1.6s linear infinite}
.ob-l:nth-child(2){animation-delay:.12s}.ob-l:nth-child(3){animation-delay:.24s}.ob-l:nth-child(4){animation-delay:.36s}
.ob-h{width:38%;height:9px;margin-bottom:3px;background:color-mix(in srgb,var(--text) 16%,transparent);animation:none}
@keyframes obShimmer{from{background-position:110% 0}to{background-position:-110% 0}}
.ob-bead{border-radius:26px;overflow:hidden}
.ob-tint,.ob-face{position:absolute;inset:0;border-radius:inherit}
.ob-tint{box-shadow:inset 0 1px 0 rgba(255,255,255,.7),0 8px 24px rgba(42,37,35,.12)}
.ob-ic{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;display:flex}
.orbit-wait{opacity:0}
.orbit-show{transition:opacity .3s ease}
.think-chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--surface);font-size:12px;color:var(--faint);min-width:120px}
.think-dots{display:inline-flex;gap:3px}
.think-dots i{width:5px;height:5px;border-radius:999px;background:var(--faint);animation:thinkDot 1.1s ease-in-out infinite}
.think-dots i:nth-child(2){animation-delay:.15s}.think-dots i:nth-child(3){animation-delay:.3s}
@keyframes thinkDot{0%,100%{opacity:.25;transform:translateY(0)}40%{opacity:1;transform:translateY(-2px)}}
@media (prefers-reduced-motion:reduce){.orbit-layer{display:none}}
/* link existing Jira / monday items */
.link-pop{padding:6px}
.link-search{gap:8px;height:38px;margin:0 2px 6px;padding:0 10px;border-radius:10px;border:1px solid var(--border);color:var(--muted)}
.link-search:focus-within{border-color:var(--control)}
.link-search input{flex:1;min-width:0;height:100%;border:none;outline:none!important;background:transparent;color:var(--text);font-size:14px;padding:0}
.link-list{list-style:none;margin:0;padding:0;max-height:264px;overflow:auto}
.link-row{display:flex;align-items:center;gap:10px;width:100%;min-height:40px;padding:0 10px;border:none;border-radius:8px;background:transparent;color:var(--text);text-align:left;font-size:14px}
.link-row:hover:not([disabled]),.link-row.act{background:var(--subtle)}
.link-row[disabled]{color:var(--faint);cursor:default}
.link-row .mono{min-width:58px}
.ext-st{flex:none;height:22px;padding:0 8px;border-radius:999px;font-size:12px;line-height:22px;background:var(--subtle);color:var(--muted)}
.ext-ok{background:var(--green-bg);color:var(--green-fg)}
.ext-info{background:var(--blue-bg);color:var(--blue-fg)}
.link-hint{display:flex;align-items:center;gap:8px;margin:6px 0 0;padding:0 10px}
.link-hint-btn{width:100%;min-height:36px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font-size:13px;text-align:left;cursor:pointer}
.link-hint-btn span:first-of-type{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.link-hint-btn:hover{background:var(--subtle)}
/* attachments */
.att-list{list-style:none;margin:0;padding:6px}
.att-row{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 6px 6px 8px;border-radius:10px}
.att-row:hover{background:var(--bg)}
.att-main{display:flex;align-items:center;gap:12px;flex:1;min-width:0;color:inherit;text-decoration:none}
.att-tile{flex:none;display:inline-flex;align-items:center;justify-content:center;background:var(--subtle);color:var(--muted)}
.att-x{opacity:0;width:28px;height:28px}
.att-row:hover .att-x,.att-x:focus-visible{opacity:1}
.att-empty{display:flex;align-items:center;gap:10px;padding:18px 20px;border-radius:16px;border:1px dashed var(--border);color:var(--muted);font-size:14px;line-height:20px}
.att-drop.drag{outline:2px dashed var(--control);outline-offset:2px;background:var(--bg)}
.att-form{display:flex;flex-wrap:wrap;gap:10px 12px;padding:14px;border-radius:16px;background:var(--surface);border:1px solid var(--border)}
.att-form .col{flex:1 1 320px}

/* search as a popover anchored to the sidebar button */
.palette.anchored{z-index:63;transform:none;width:440px;border-radius:14px;transform-origin:top left}
.palette.anchored input{height:44px;padding:0 14px;font-size:14px}
.palette.anchored .pal-item{padding:8px 14px}
/* small date fields sit next to our own calendar icon, so hide the browser's and open the picker on click */
.input.sm[type=date]{cursor:pointer}
.input.sm[type=date]::-webkit-calendar-picker-indicator{display:none}
/* collapsible sidebar */
.ic-mob{display:none}.ic-desk{display:flex}
.nav-toggle{color:var(--muted)}
.nav-link{position:relative}
.nav-c .side{flex:0 0 68px;max-width:68px;padding:20px 12px 16px;align-items:stretch}
.nav-c .side .brand,.nav-c .side .nav.spaces,.nav-c .side .nav-link .grow,.nav-c .side .nl,.nav-c .side .search-btn span,.nav-c .side .profile-wrap .col,.nav-c .side .profile-wrap .faint{display:none}
.nav-c .side .side-top{justify-content:center}
.nav-c .side .btn.lg,.nav-c .side .btn.side-new{padding:0;width:44px!important;margin:0 auto}
.nav-c .side .search-btn{width:44px;padding:0;justify-content:center;margin:0 auto}
.nav-c .side .nav-link{width:44px;padding:0;justify-content:center;margin:0 auto}
.nav-c .side .count{position:absolute;top:2px;right:0;min-width:16px;height:16px;padding:0 4px;font-size:10px;line-height:16px}
.nav-c .side .profile-wrap .pop{right:auto;width:260px}
.nav-c .side .profile-wrap .nav-link{height:44px}
@media (max-width:900px){
  .ic-mob{display:flex}.ic-desk{display:none}
  .nav-c .side{flex:1 1 100%;max-width:100%;padding:12px 16px;gap:0}
  .nav-c .side>*:not(.side-top){display:none!important}
  .nav-c .side .side-top{justify-content:space-between}
  .nav-c .side .brand{display:flex}
}
/* custom dropdowns (replace every native select) */
.dd{position:relative;display:inline-flex;max-width:100%}
.dd.full{display:flex;width:100%}
.dd-btn{display:inline-flex;align-items:center;gap:8px;min-width:0;max-width:100%;height:32px;padding:0 8px 0 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text);font-size:13px;font-weight:500;white-space:nowrap;text-align:left;transition:border-color .12s ease}
.dd-btn:hover{border-color:var(--border-strong)}
.dd-btn[aria-expanded=true]{border-color:var(--control)}
.dd-btn .ddv{display:inline-flex;align-items:center;gap:6px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.dd-btn .ddc{flex:none;display:flex;margin-left:auto;color:var(--muted)}
.dd-field{width:100%;height:40px;padding:0 10px 0 12px;border-radius:10px;font-size:14px;font-weight:400}
.dd-pill{border-radius:999px}
.dd-tool{height:36px;border-radius:10px}
.dd-quiet{border-color:transparent;background:transparent;padding:0 6px}
.dd-quiet:hover{background:var(--subtle);border-color:transparent}
.dd:has(.dd-pop),.ctrl-in:has(.dd-pop),.unfold:has(.dd-pop),.fade-in:has(.dd-pop),.rise:has(.dd-pop),.orbit-show:has(.dd-pop),.comp-row:has(.dd-pop){position:relative;z-index:50}
.dd-pop{left:0;top:calc(100% + 4px);min-width:100%;width:max-content;max-width:320px;max-height:300px;overflow-y:auto;z-index:46}
.dd-pop .menu-item{height:auto;min-height:36px;padding:6px 10px;white-space:nowrap}
.date-f{position:relative;display:inline-flex;max-width:100%}
.date-f.full{display:flex;width:100%}
.date-hidden{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;padding:0;margin:0;cursor:pointer;z-index:1;color-scheme:light dark}
/* the native date input sits invisibly over the styled button; its calendar indicator is stretched to cover it, so a click
   opens the browser's own picker directly (showPicker() is blocked in cross-origin iframes, which is how artifacts are served) */
.date-hidden::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;margin:0;padding:0;opacity:0;cursor:pointer}
.date-f:hover > button{background:var(--subtle)}
.date-f:focus-within > button{outline:2px solid var(--control,#8B837E);outline-offset:2px}
input[type=date].sm{position:relative}
input[type=date].sm::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;opacity:0;cursor:pointer}
/* component goals */
.org-name{font-weight:600;color:var(--text)!important;height:26px!important;font-size:14px!important;width:100%;max-width:280px;margin-left:-8px}
.org-desc{height:24px!important;width:100%;margin-left:-8px;font-size:13px!important}
.glance{gap:10px;padding:16px;text-align:left;color:var(--text);transition:border-color .12s ease}
.glance:hover{border-color:var(--border-strong)}
.icon-grid{display:grid;grid-template-columns:repeat(6,32px);gap:4px}
.icon-opt{width:32px;height:32px;padding:0;border-radius:8px;border:1px solid transparent;background:transparent;display:flex;align-items:center;justify-content:center}
.icon-opt:hover{background:var(--subtle)}
.icon-opt.on{border-color:var(--border-strong);background:var(--subtle)}
.color-pick .sw.ic{display:flex;align-items:center;justify-content:center}
/* delete an org component: the x appears on hover, like attention rows */
.org-x{width:0!important;margin-left:-8px;opacity:0;overflow:hidden;transition:width .15s ease,margin .15s ease,opacity .12s}
.set-row:hover .org-x,.set-row:focus-within .org-x,.org-x[aria-expanded=true]{width:32px!important;margin-left:0;opacity:1}
@media (hover:none){.org-x{width:32px!important;margin-left:0;opacity:1}}
.btn-danger{background:var(--red-bg);border-color:var(--red-bg);color:var(--red-fg)}
.btn-danger:hover{border-color:color-mix(in srgb,var(--red-fg) 30%,transparent)}
.confirm.org{min-height:56px;border-top:1px solid var(--divider);background:var(--raised)}
.confirm.org:first-child{border-top:none;border-radius:15px 15px 0 0}
textarea.goal-in{display:block;min-height:28px;margin-left:-8px;width:calc(100% + 8px)!important;font-size:13px!important;line-height:18px;padding:4px 8px!important;resize:none;overflow:hidden;white-space:pre-wrap}

/* user-test start screen */
.test-tips{list-style:none;margin:0;padding:0;gap:10px}
.test-tips li{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:20px;color:var(--muted)}
.test-tips li svg{flex:none;margin-top:3px;color:var(--text)}

/* component icon tile */
.comp-tile{flex:none;display:inline-flex;align-items:center;justify-content:center}

/* responsive sidebar: never wrap the page under it; below 1280px it opens over the page */
.shell{flex-wrap:nowrap}
.side{flex:0 0 248px;max-width:248px}
.mainwrap{flex:1 1 0}
.nav-ph{flex:none}
.nav-mid .nav-ph{width:68px;border-right:1px solid var(--border)}
.nav-narrow .nav-ph{height:57px;border-bottom:1px solid var(--border)}
.nav-over .side{position:fixed;top:0;left:0;bottom:0;width:272px;max-width:86vw;min-height:0;height:100vh;overflow-y:auto;z-index:70;border-right:1px solid var(--border);border-bottom:none;padding:20px 12px 16px;box-shadow:0 16px 48px rgba(42,37,35,.18);animation:navIn .22s cubic-bezier(.2,.8,.2,1)}
.nav-scrim{position:fixed;inset:0;z-index:69;background:rgba(42,37,35,.2);animation:navFade .2s ease}
[data-theme=dark] .nav-scrim{background:rgba(0,0,0,.45)}
@keyframes navIn{from{transform:translateX(-28px);opacity:0}}
@keyframes navFade{from{opacity:0}}
@media (max-width:899px){
  .shell{flex-direction:column}
  .nav-c .side{flex:none;width:100%;max-width:100%;min-height:0;position:sticky;top:0;z-index:50}
  .nav-narrow .mainwrap{flex:1 1 auto}
}
@media (prefers-reduced-motion:reduce){.nav-over .side,.nav-scrim{animation:none}}

/* shaping from a Jira or monday item: messages */
.shape-err,.shape-note{gap:8px;align-items:flex-start;margin:8px 0 0;color:var(--warn-fg,#92400E)}
.shape-note{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--amber-bg);color:var(--amber-fg)}
.shape-err svg,.shape-note svg{flex:none;margin-top:3px}

/* sidebar New capsule: compact, in scale with the nav rows */
.side .btn.side-new{height:34px;padding:0 12px;font-size:13.5px;gap:6px}
.nav-c .side .btn.side-new{height:36px}

/* created confirmation: fades out on its own */
.banner-out{animation:bannerOut .35s ease forwards}
@keyframes bannerOut{to{opacity:0;transform:translateY(-6px)}}
@media (prefers-reduced-motion:reduce){.banner-out{animation:none;opacity:0}}
/* browse spaces */
.sp-list{list-style:none;margin:0;padding:4px 0}
.sp-row{display:flex;align-items:center;gap:16px;padding:14px 18px}
.sp-row + .sp-row{border-top:1px solid var(--divider)}
.sp-name{font-size:15px;font-weight:600;color:var(--text)}
.link-btn.sp-name{background:none;border:none;padding:0;cursor:pointer}
.link-btn.sp-name:hover{text-decoration:underline}
.sp-meta{gap:8px;flex:none}
.sp-row .btn{flex:none;min-width:84px;justify-content:center}
.sp-joined .when-hover{display:none}
.sp-joined:hover .when-rest,.sp-joined:focus-visible .when-rest{display:none}
.sp-joined:hover .when-hover,.sp-joined:focus-visible .when-hover{display:inline}
.sp-joined .when-rest{display:inline-flex;align-items:center;gap:6px}
.search-row{gap:8px;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);max-width:360px}
.search-row input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--text);font-size:14px}
.search-row:focus-within{border-color:var(--control,#8B837E)}
@media (max-width:700px){.sp-row{flex-wrap:wrap}.sp-meta{order:3;width:100%}}

/* user-test start: role picker */
.test-roles{border:none;margin:0;padding:0}
.test-role{display:flex;gap:12px;align-items:flex-start;width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);color:var(--text);cursor:pointer;font-size:14px;line-height:20px}
.test-role:hover{background:var(--bg)}
.test-role.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.test-radio{flex:none;width:16px;height:16px;margin-top:2px;border-radius:999px;border:1.5px solid var(--faint)}
.test-role.on .test-radio{border:5px solid var(--text)}

</style>

    desc: 'Internal launch of the partner referral program: announcement, sales enablement and support readiness.',

  if (/docs\.google\.com\/presentation|slides\.google/.test(u)) return 'slides';
  if (/docs\.google\.com|drive\.google\.com/.test(u)) return 'doc';
  if (/notion\.(so|site)/.test(u)) return 'notion';
  if (/atlassian\.net\/wiki|confluence/.test(u)) return 'wiki';
  if (/loom\.com/.test(u)) return 'video';
  if (/\.pdf($|\?)/.test(u)) return 'pdf';
  return 'link';
}
function attKindFromFile(n) {
  const e = (n.split('.').pop() || '').toLowerCase();
  if (e === 'pdf') return 'pdf';
  if (/^(png|jpe?g|gif|webp|svg|heic)$/.test(e)) return 'image';
  if (/^(xlsx?|csv|numbers)$/.test(e)) return 'sheet';
  if (/^(docx?|pages|txt|md|rtf)$/.test(e)) return 'doc';
  if (/^(pptx?|key)$/.test(e)) return 'slides';
  if (e === 'fig') return 'design';
  if (/^(mp4|mov|webm)$/.test(e)) return 'video';
  return 'file';
}
function attLabel(a) { const k = ATT_KINDS[a.kind] || ATT_KINDS.file; if (a.kind === 'link') { try { return new URL(a.url).hostname.replace(/^www\./, ''); } catch (e) { return 'Link'; } } if (a.size) return (a.kind === 'file' || a.kind === 'pdf' || a.kind === 'image' ? k.label : (a.name.split('.').pop() || '').toUpperCase() + ' file') + ' · ' + a.size; return k.label; }
function fmtSize(b) { return b < 1024 ? b + ' B' : b < 1048576 ? Math.round(b / 1024) + ' KB' : (b / 1048576).toFixed(1) + ' MB'; }
function looksLikeUrl(s) { return /^(https?:\/\/)?[\w-]+(\.[\w-]+)+(\/\S*)?$/i.test(s.trim()); }
function normUrl(s) { s = s.trim(); return /^https?:\/\//i.test(s) ? s : 'https://' + s; }
function titleFromUrl(u) {
  try { const x = new URL(u); const seg = x.pathname.split('/').filter(Boolean).pop() || ''; const t = decodeURIComponent(seg).replace(/[-_]+/g, ' ').replace(/\.[a-z0-9]+$/i, '').trim(); return t && !/^[a-z0-9]{12,}$/i.test(t) ? cap1(t) : x.hostname.replace(/^www\./, ''); } catch (e) { return u; }
}

function attachmentsSection(c, collab, isOwner) {
  const p = me(); const list = attachmentsOf(c);
  if (!collab && !list.length) return '';
  const A2 = U.att && U.att.capId === c.id ? U.att : null;
  const menu = A2 && A2.menu ? '<div class="pop pop-in" role="menu" aria-label="Add an attachment" style="right:0;top:40px;width:220px">' +
      '<label role="menuitem" class="menu-item" for="att-file" style="cursor:pointer">' + ic('up', 14) + 'Upload a file</label>' +
      '<button type="button" role="menuitem" class="menu-item" data-a="attLinkOpen">' + ic('link', 14) + 'Add a link</button></div>' : '';
  const head = '<div class="row" style="justify-content:space-between;align-items:center;gap:8px"><h2 id="att-h" class="h2">Attachments' + (list.length ? ' <span class="n">' + list.length + '</span>' : '') + '</h2>' +
    (collab ? '<div style="position:relative"><input type="file" id="att-file" multiple class="sr" tabindex="-1" data-in="attFiles"><button type="button" class="btn btn-secondary" style="height:32px;padding:0 12px 0 10px;gap:6px" data-a="attMenu" aria-haspopup="menu" aria-expanded="' + !!(A2 && A2.menu) + '">' + ic('plus', 14, 1.6) + 'Add</button>' + menu + '</div>' : '') + '</div>';
  const linkForm = A2 && A2.linkOpen ? '<div class="att-form" role="group" aria-label="Add a link">' +
      '<div class="col grow" style="gap:6px;min-width:0"><label class="sr" for="att-url">Link</label><input id="att-url" type="text" class="input' + (A2.err ? ' bad' : '') + '" placeholder="Paste a link to a doc, design, page or video" value="' + esc(A2.url || '') + '" data-in="attUrl" data-kd="attKey" autocomplete="off">' +
      '<label class="sr" for="att-title">Name (optional)</label><input id="att-title" type="text" class="input" placeholder="Name (optional)" value="' + esc(A2.title || '') + '" data-in="attTitle" data-kd="attKey" autocomplete="off">' +
      (A2.err ? '<span class="tiny" style="color:var(--warn-fg)">' + esc(A2.err) + '</span>' : (A2.url && looksLikeUrl(A2.url) ? '<span class="tiny muted row" style="gap:6px">' + attTile(attKindFromUrl(A2.url), 18) + 'Adds as ' + esc(ATT_KINDS[attKindFromUrl(A2.url)].label.replace('Link', 'a link')) + '</span>' : '')) + '</div>' +
      '<div class="row" style="gap:6px;align-self:flex-start"><button type="button" class="btn btn-primary" data-a="attLinkAdd"' + ((A2.url || '').trim() ? '' : ' disabled') + '>Add link</button><button type="button" class="btn btn-quiet" data-a="attLinkCancel">Cancel</button></div></div>' : '';
  let body;
  if (!list.length) body = '<div class="att-drop att-empty" data-cap="' + c.id + '">' + ic('up', 16) + '<span>Drop files here, or <label for="att-file" class="btn-link" style="font-size:14px;cursor:pointer">upload</label> or <button type="button" class="btn-link" style="font-size:14px" data-a="attLinkOpen">add a link</button>. Specs, designs, decks and recordings all work.</span></div>';
  else body = '<ul class="card att-list att-drop" data-cap="' + c.id + '">' + list.map(function (a, i) {
    const canRm = collab && (isOwner || a.by === p);
    const kc = a.comp ? (c.comps.find(function (k) { return k.name === a.comp; }) || null) : null;
    return '<li class="att-row" data-k="att-' + a.id + '" style="' + (i ? 'border-top:1px solid var(--divider)' : '') + '">' +
      '<a href="#" class="att-main" data-a="attOpen" data-x="' + a.id + '">' + attTile(a.kind, 32) + '<span class="col grow" style="min-width:0;gap:1px"><span class="ell" style="font-weight:500">' + esc(a.name) + '</span><span class="tiny muted ell">' + esc(attLabel(a)) + ' · ' + esc(pshort(a.by, true)) + ' · ' + esc(a.when) + '</span></span></a>' +
      (kc ? '<span class="tag c-' + compColor(kc.name) + '">' + esc(kc.name) + '</span>' : '') +
      (canRm ? '<button type="button" class="icon-btn att-x" aria-label="Remove ' + esc(a.name) + '" data-a="attRemove" data-x="' + a.id + '">' + ic('x', 14, 1.6) + '</button>' : '') + '</li>';
  }).join('') + '</ul>';
  return '<section aria-labelledby="att-h" class="sec" style="position:relative;z-index:' + (A2 && A2.menu ? 30 : 1) + '">' + head + linkForm + body + (collab && list.length ? '<p class="tiny muted" style="margin:-4px 0 0">Drop files anywhere on the list to attach them.</p>' : '') + '</section>';
}
function attTile(kind, size) {
  const k = ATT_KINDS[kind] || ATT_KINDS.file; const s = size || 32;
  return '<span class="att-tile" style="width:' + s + 'px;height:' + s + 'px;border-radius:' + Math.round(s / 4) + 'px" aria-hidden="true">' + '<svg width="' + Math.round(s / 2) + '" height="' + Math.round(s / 2) + '" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">' + k.ic + '</svg></span>';
}

/* -- actions -- */
POP_KEYS.attMenu = 'attMenuOpen';
function attState(c) { if (!U.att || U.att.capId !== c.id) U.att = { capId: c.id, menu: false, linkOpen: false, url: '', title: '', err: '' }; return U.att; }
A.attMenu = function () { const s = attState(cap(S.route.id)); s.menu = !s.menu; };
A.attLinkOpen = function () { const s = attState(cap(S.route.id)); s.menu = false; s.linkOpen = true; s.err = ''; U.focus = 'att-url'; };
A.attLinkCancel = function () { if (U.att) Object.assign(U.att, { linkOpen: false, url: '', title: '', err: '' }); };
IN.attUrl = function (v) { U.att.url = v; U.att.err = ''; };
IN.attTitle = function (v) { U.att.title = v; };
KD.attKey = function (e) { if (e.key === 'Enter') { e.preventDefault(); A.attLinkAdd(); update(); } else if (e.key === 'Escape') { A.attLinkCancel(); update(); } };
function attAdd(c, items, what) {
  const ukey = 'at' + now();
  tx(ukey, function () {
    items.forEach(function (a) { pushTo(attachmentsOf(c), a); });
    addActivity(c.id, me(), 'attached ' + (items.length === 1 ? '“' + items[0].name + '”' : items.length + ' files'), 'Capsule', 'Scope change');
  });
  save(); toast((items.length === 1 ? '“' + items[0].name + '”' : items.length + ' files') + ' ' + what, ukey);
}
A.attLinkAdd = function () {
  const c = cap(S.route.id); const s = attState(c); const raw = (s.url || '').trim(); if (!raw) return;
  if (!looksLikeUrl(raw)) { s.err = 'That doesn’t look like a link. Paste the full address, like figma.com/file/…'; U.focus = 'att-url'; return; }
  const url = normUrl(raw);
  if (attachmentsOf(c).some(function (a) { return a.url === url; })) { s.err = 'That link is already attached.'; U.focus = 'att-url'; return; }
  const kind = attKindFromUrl(url);
  attAdd(c, [{ id: nextId('at'), kind: kind, name: (s.title || '').trim() || titleFromUrl(url), url: url, by: me(), when: 'Just now' }], 'attached');
  Object.assign(s, { linkOpen: false, url: '', title: '', err: '' });
};
function attFromFiles(files) { return [].slice.call(files || []).map(function (f) { return { id: nextId('at'), kind: attKindFromFile(f.name), name: f.name, size: fmtSize(f.size), by: me(), when: 'Just now' }; }); }
IN.attFiles = function (v, d, el) {
  const c = cap(S.route.id); const items = attFromFiles(el.files); if (U.att) U.att.menu = false;
  if (items.length) attAdd(c, items, 'attached');
  try { el.value = ''; } catch (e) {}
};
A.attRemove = function (d) {
  const c = cap(S.route.id); const list = attachmentsOf(c); const a = list.find(function (x) { return x.id === d.x; }); if (!a) return;
  const ukey = 'ar' + now(); const i = list.indexOf(a);
  tx(ukey, function () { list.splice(i, 1); rec(function () { list.splice(i, 0, a); }); addActivity(c.id, me(), 'removed the attachment “' + a.name + '”', 'Capsule', 'Scope change'); });
  save(); toast('Removed “' + a.name + '”', ukey);
};
A.attOpen = function (d) {
  const a = attachmentsOf(cap(S.route.id)).find(function (x) { return x.id === d.x; }); if (!a) return;
  toast(a.url ? 'This would open ' + a.name + ' in a new tab. Links are static in the demo.' : 'This would open ' + a.name + '. Files aren’t stored in the demo.');
};
/* drag and drop onto the list or the empty drop zone */
(function () {
  let depth = 0;
  function zone(e) { return e.target.closest && e.target.closest('.att-drop'); }
  document.addEventListener('dragenter', function (e) { const z = zone(e); if (!z) return; depth++; z.classList.add('drag'); });
  document.addEventListener('dragleave', function (e) { const z = zone(e); if (!z) return; depth = Math.max(0, depth - 1); if (!depth) z.classList.remove('drag'); });
  document.addEventListener('dragover', function (e) { if (zone(e)) e.preventDefault(); });
  document.addEventListener('drop', function (e) {
    const z = zone(e); if (!z) return; e.preventDefault(); depth = 0; z.classList.remove('drag');
    const c = cap(z.getAttribute('data-cap')); if (!c) return;
    const items = attFromFiles(e.dataTransfer && e.dataTransfer.files);
    if (items.length) { attAdd(c, items, 'attached'); update(); }
  });
})();

/* ===== App shell, rendering and events ===== */
const root = document.getElementById('app');
function freshSidebar() {
  return '<aside class="side"><span class="brand"><span class="brand-mark" aria-hidden="true"></span><span class="brand-name">Capsule</span></span>' +
    '<div class="col" style="gap:8px"><button type="button" class="btn btn-primary lg" style="width:100%" data-a="toast" data-x="In the preview org there’s nothing to set up yet. Go back to the demo to try New capsule.">' + ic('plus', 16, 1.6) + 'New capsule</button></div>' +
    '<nav class="nav"><span class="nav-link on">' + ic('home') + '<span class="grow">Home</span></span><span class="nav-link">' + ic('at') + 'Mentions</span><span class="nav-link">' + ic('capsule') + 'Capsules</span></nav>' +
    '<div class="profile-wrap"><button type="button" class="nav-link" style="height:44px;color:var(--text)" data-a="signOut"><span class="av me">C</span><span class="grow col" style="text-align:left"><span>Christina</span><span class="tiny muted" style="font-weight:400">Exit preview</span></span></button></div></aside>';
}
function view() {
  const r = S.route.name;
  if (r === 'onboard' && U.ob) return onboardingScreen() + toastsView();
  if (!S.persona || r === 'login' || r === 'onboard') return loginScreen() + toastsView();
  if (r === 'fresh') return '<div class="shell">' + freshSidebar() + '<div class="mainwrap">' + homeScreen(true) + '</div></div>' + toastsView();
  let screen = '';
  if (r === 'home') screen = homeScreen(false);
  else if (r === 'queue') screen = queueScreen();
  else if (r === 'capsules') screen = capsulesScreen();
  else if (r === 'spaces') screen = spacesScreen();
  else if (r === 'capsule') screen = capsuleScreen();
  else if (r === 'new') screen = U.nc ? newScreen() : homeScreen(false);
  else if (r === 'settings') screen = settingsScreen();
  else if (r === 'agents') screen = settingsScreen();
  else screen = homeScreen(false);
  const mode = navMode(), over = mode !== 'wide' && !!U.navOpen;
  return '<div class="shell nav-' + mode + (over ? ' nav-over' : navCollapsed() ? ' nav-c' : '') + '">' + (over ? '<div class="nav-ph" aria-hidden="true"></div><div class="nav-scrim" data-a="closeNav" aria-hidden="true"></div>' : '') + sidebar() + '<div class="mainwrap">' + screen + '</div></div>' + (U.palette ? paletteView() : '') + toastsView();
}

let raf = 0, tickT = 0;
function update() { if (!raf) raf = requestAnimationFrame(render); }
function render() {
  raf = 0;
  pump();
  morph(root, view());
  document.querySelectorAll('textarea.autogrow').forEach(autogrow);
  // focus requests
  if (U.focus) {
    const el = document.getElementById(U.focus);
    U.focus = null;
    if (el) { el.focus({ preventScroll: false }); if (el.setSelectionRange && /text|search|email|textarea/.test(el.type || el.tagName.toLowerCase())) { try { const n = el.value.length; el.setSelectionRange(n, n); } catch (e) {} } }
  }
  // keep popovers inside the main column: if one would slide under the sidebar (or off the right edge), flip its anchor
  const mw = document.querySelector('.mainwrap');
  if (mw) {
    const lim = mw.getBoundingClientRect();
    document.querySelectorAll('.mainwrap .pop').forEach(function (el) {
      const r = el.getBoundingClientRect();
      if (r.left < lim.left + 8) { el.style.right = 'auto'; el.style.left = '0'; }
      else if (r.right > lim.right - 8) { el.style.left = 'auto'; el.style.right = '0'; }
    });
  }
  // search opens as a popover under the sidebar's search button
  const pal = document.querySelector('.palette'), sb = document.querySelector('.side .search-btn');
  if (pal && sb && sb.offsetParent) { const r = sb.getBoundingClientRect(); pal.classList.add('anchored'); pal.style.left = r.left + 'px'; pal.style.top = (r.bottom + 6) + 'px'; }
  if (U.showPicker) { const el = document.getElementById(U.showPicker); U.showPicker = null; if (el && el.showPicker) { try { el.showPicker(); } catch (e) {} } }
  if (U.focusSel) { const el = document.querySelector(U.focusSel); U.focusSel = null; if (el) el.focus(); }
  if (U.scrollHl) {
    U.scrollHl = false;
    const el = document.getElementById('hl-wi') || document.getElementById('hl-act');
    if (el) setTimeout(function () { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 60);
    else { try { window.scrollTo(0, 0); } catch (e) {} }
  }
  if (U.scrollTo) { const el = document.getElementById(U.scrollTo); U.scrollTo = null; if (el) el.scrollIntoView({ block: 'start', behavior: 'smooth' }); }
  scheduleTick();
}
function scheduleTick() {
  clearTimeout(tickT);
  const t = now(); let next = Infinity;
  function consider(at) { if (at > t && at < next) next = at; }
  Object.keys(S.queues).forEach(function (p) { S.queues[p].forEach(function (it) { if (it.confirm) consider(it.confirm.at + 5000); if (it.nudgedAt) consider(it.nudgedAt + 5000); }); });
  S.scheduled.forEach(function (e) { consider(e.at); });
  if (U.removedComp) consider(U.removedComp.at + 5000);
  if (U.orgDeleted) consider(U.orgDeleted.at + 5000);
  if (U.hl) consider(U.hlAt + 2700);
  if (next !== Infinity) tickT = setTimeout(update, next - t + 30);
}

/* events */
root.addEventListener('click', function (e) {
  if (e.target.type === 'date' && e.target.classList.contains('sm') && e.target.showPicker) { try { e.target.showPicker(); } catch (er) {} }
  const el = e.target.closest('[data-a]');
  const inPop = e.target.closest('.pop');
  const name = el ? el.getAttribute('data-a') : null;
  if (!inPop) closePops(name ? (POP_KEYS[name] || (name === 'ncToggleAdd' ? 'ncAdd' : name === 'obColorOpen' || name === 'obIconOpen' ? 'obColor' : null)) : null);
  if (el && el.tagName === 'A') e.preventDefault();
  if (el && A[name]) {
    if (el.disabled) return;
    if (el.tagName === 'TR' && e.target.closest('button')) { update(); return; }
    A[name](el.dataset, el, e);
  }
  update();
});
function autogrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
function handleIn(e) {
  const el = e.target;
  if (el.classList && el.classList.contains('autogrow')) autogrow(el); const k = el.getAttribute && el.getAttribute('data-in');
  if (!k || !IN[k]) return;
  const isChange = el.tagName === 'SELECT' || el.type === 'date';
  if ((e.type === 'input') === isChange) return;
  IN[k](el.value, el.dataset, el);
  update();
}
root.addEventListener('input', handleIn);
root.addEventListener('change', handleIn);
root.addEventListener('focusout', function (e) {
  const cm = e.target.getAttribute && e.target.getAttribute('data-commit');
  if (cm && A[cm]) { A[cm]({ x: e.target.getAttribute('data-x') }); update(); return; }
  const el = e.target; if (!el.getAttribute || !el.getAttribute('data-blur')) return;
  const f = U.edit && U.edit.field;
  setTimeout(function () { if (U.edit && U.edit.field === f && !document.activeElement.closest('[data-blur]')) { A[el.getAttribute('data-blur')](); update(); } }, 150);
});
root.addEventListener('submit', function (e) { e.preventDefault(); });
root.addEventListener('keydown', function (e) {
  const el = e.target.closest && e.target.closest('[data-kd]');
  if (el && KD[el.getAttribute('data-kd')]) { KD[el.getAttribute('data-kd')](e, el.dataset, el); update(); }
});
document.addEventListener('keydown', function (e) {
  if ((e.metaKey || e.ctrlKey) && (e.key === 'k' || e.key === 'K') && S.persona && S.route.name !== 'login' && S.route.name !== 'onboard') { e.preventDefault(); A.openPalette(); update(); return; }
  if (e.key === 'Escape' && !e.defaultPrevented) {
    if (U.palette) U.palette = false;
    else if (U.navOpen && navMode() !== 'wide') A.closeNav();
    else if (U.review) A.closeReview();
    else if (U.menu || U.profile || U.mentions || U.followersOpen || U.followMenu || U.compMenu || U.addComp || U.teamAdd || U.orgDel || U.orgPick) closePops(null);
    else if (U.deleg) U.deleg = null;
    update();
  }
});
try { window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', function () { applyTheme(); }); } catch (e) {}

/* boot */
S = TESTING ? freshState() : (load() || freshState()); // a user-test session always starts from the sample data
syncSpaces();
if (S.route.name === 'onboard' || S.route.name === 'new') S.route = S.persona ? { name: S.route.name === 'new' ? 'new' : 'home' } : { name: 'login' };
if (S.route.name === 'new') U.nc = ncNew('');
applyTheme();
render();

/* re-lay out when the window crosses a sidebar breakpoint */
(function () { let last = navMode(); window.addEventListener('resize', function () { const m = navMode(); if (m !== last) { last = m; U.navOpen = false; update(); } }); })();

</script>
